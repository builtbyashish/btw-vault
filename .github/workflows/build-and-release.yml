name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Release
    runs-on: ubuntu-latest

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Install ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('package-lock.json', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache -z

      - name: Setup Android release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Restoring release.keystore from GitHub secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          fi
          if [ -f android/app/release.keystore ]; then
            echo "Release keystore is verified and ready."
          else
            echo "ERROR: android/app/release.keystore is missing!"
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Configure environment (.env)
        run: |
          echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID || '569470226281-04u4ajijsqqbaa90r9heo410mbv9n453.apps.googleusercontent.com' }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || '569470226281-04u4ajijsqqbaa90r9heo410mbv9n453.apps.googleusercontent.com' }}" >> .env
          echo "Configured .env with Google OAuth Client IDs for release APK."

      - name: Build Android Release APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          USE_CCACHE: '1'
          CCACHE_COMPRESS: 'true'
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: Show ccache stats
        run: ccache -s

      - name: Prepare APK artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Find generated release APK
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found in android/app/build/outputs/apk/release!"
            exit 1
          fi
          
          echo "Found APK at: $APK_PATH"
          mkdir -p release-artifacts
          cp "$APK_PATH" "release-artifacts/btw-vault-v${VERSION}.apk"
          echo "Copied APK to release-artifacts/btw-vault-v${VERSION}.apk"

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating artifact..."
            gh release upload "$TAG" release-artifacts/*.apk --clobber
          else
            echo "Creating GitHub Release for $TAG..."
            gh release create "$TAG" release-artifacts/*.apk \
              --title "Release v${VERSION}" \
              --generate-notes
          fi

      - name: Direct Download Summary (No Zip)
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/btw-vault-v${VERSION}.apk"
          echo "## 🚀 Direct APK Download (No Zip)" >> $GITHUB_STEP_SUMMARY
          echo "Direct uncompressed APK download:" >> $GITHUB_STEP_SUMMARY
          echo "- **[Download btw-vault-v${VERSION}.apk](${DOWNLOAD_URL})**" >> $GITHUB_STEP_SUMMARY
          echo "- View on Releases: [v${VERSION}](https://github.com/${{ github.repository }}/releases/tag/v${VERSION})" >> $GITHUB_STEP_SUMMARY
