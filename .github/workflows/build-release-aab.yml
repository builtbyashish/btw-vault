name: Build Android Release AAB (Play Store)

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Git tag or branch to build (e.g. v1.3.0, main, develop)'
        required: true
        default: 'main'
        type: string

permissions:
  contents: write

jobs:
  build-release-aab:
    name: Build & Publish Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout specified tag or branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_version }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Install ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('package-lock.json', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache -z

      - name: Setup Android release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Restoring release.keystore from GitHub secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          fi
          if [ -f android/app/release.keystore ]; then
            echo "Release keystore is verified and ready."
          else
            echo "ERROR: android/app/release.keystore is missing!"
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Configure environment (.env)
        run: |
          echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID || '569470226281-04u4ajijsqqbaa90r9heo410mbv9n453.apps.googleusercontent.com' }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || '569470226281-04u4ajijsqqbaa90r9heo410mbv9n453.apps.googleusercontent.com' }}" >> .env
          echo "Configured .env for Play Store release AAB bundle build."

      - name: Build Android Release App Bundle (AAB)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          USE_CCACHE: '1'
          CCACHE_COMPRESS: 'true'
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon
          cd ..

      - name: Show ccache stats
        run: ccache -s

      - name: Prepare AAB artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Find generated AAB bundle
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            echo "Error: No AAB found in android/app/build/outputs/bundle/release!"
            exit 1
          fi
          
          echo "Found AAB at: $AAB_PATH"
          mkdir -p bundle-artifacts
          cp "$AAB_PATH" "bundle-artifacts/btw-vault-v${VERSION}.aab"
          echo "Copied AAB to bundle-artifacts/btw-vault-v${VERSION}.aab"

      - name: Attach AAB to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_REF: ${{ inputs.tag_version }}
        run: |
          TAG="${INPUT_REF}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            TAG="v${VERSION}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Uploading .aab bundle to existing release $TAG..."
            gh release upload "$TAG" bundle-artifacts/*.aab --clobber
          else
            echo "Creating release $TAG with AAB bundle..."
            gh release create "$TAG" bundle-artifacts/*.aab \
              --title "btw vault ${TAG}" \
              --notes "Android App Bundle (.aab) for Google Play Console upload."
          fi

      - name: Direct Download Summary (No Zip)
        run: |
          TAG="${{ inputs.tag_version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            TAG="v${VERSION}"
          fi
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/btw-vault-v${VERSION}.aab"
          echo "## 🚀 Direct AAB Bundle Download (No Zip)" >> $GITHUB_STEP_SUMMARY
          echo "Direct uncompressed Android App Bundle download for Play Store:" >> $GITHUB_STEP_SUMMARY
          echo "- **[Download btw-vault-v${VERSION}.aab](${DOWNLOAD_URL})**" >> $GITHUB_STEP_SUMMARY
          echo "- View on Releases: [${TAG}](https://github.com/${{ github.repository }}/releases/tag/${TAG})" >> $GITHUB_STEP_SUMMARY
