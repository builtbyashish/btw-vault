name: Build Android Debug APK

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target architecture (arm64-v8a for physical phones, all for emulators)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - arm64-v8a,armeabi-v7a
          - armeabi-v7a,arm64-v8a,x86,x86_64

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Ensure Android debug keystore exists
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore exists."
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Configure environment (.env)
        run: |
          echo "EXPO_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID || '569470226281-04u4ajijsqqbaa90r9heo410mbv9n453.apps.googleusercontent.com' }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || '569470226281-04u4ajijsqqbaa90r9heo410mbv9n453.apps.googleusercontent.com' }}" >> .env
          echo "Configured .env for debug APK build."

      - name: Build Android Debug APK
        run: |
          ARCH="${{ inputs.architecture || 'arm64-v8a' }}"
          echo "Building debug APK for architecture: $ARCH"
          cd android
          ./gradlew assembleDebug -PreactNativeArchitectures="$ARCH" --no-daemon
          cd ..

      - name: Prepare Debug APK artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Find generated debug APK
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found in android/app/build/outputs/apk/debug!"
            exit 1
          fi
          
          echo "Found APK at: $APK_PATH"
          mkdir -p debug-artifacts
          cp "$APK_PATH" "debug-artifacts/btw-vault-debug-v${VERSION}.apk"
          echo "Copied APK to debug-artifacts/btw-vault-debug-v${VERSION}.apk"

      - name: Publish or Update Debug Pre-Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}-debug"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Pre-release $TAG already exists, updating artifact..."
            gh release upload "$TAG" debug-artifacts/*.apk --clobber
          else
            echo "Creating pre-release $TAG..."
            gh release create "$TAG" debug-artifacts/*.apk \
              --prerelease \
              --title "btw vault v${VERSION} (Debug Build)" \
              --notes "Development Debug APK with native SQLCipher encryption engine. Direct download for Android testing without building locally."
          fi

      - name: Direct Download Summary (No Zip)
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}-debug/btw-vault-debug-v${VERSION}.apk"
          echo "## 🚀 Direct Debug APK Download (No Zip)" >> $GITHUB_STEP_SUMMARY
          echo "Direct uncompressed debug APK download:" >> $GITHUB_STEP_SUMMARY
          echo "- **[Download btw-vault-debug-v${VERSION}.apk](${DOWNLOAD_URL})**" >> $GITHUB_STEP_SUMMARY
          echo "- View on Releases: [v${VERSION}-debug](https://github.com/${{ github.repository }}/releases/tag/v${VERSION}-debug)" >> $GITHUB_STEP_SUMMARY
